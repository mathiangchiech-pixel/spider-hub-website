<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Owner panel · Spider Websites</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/auth.css">
  <style>
    .owner-wrap{width:min(100%,1100px);margin:65px auto;padding:0 6px}.owner-wrap h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.06em}.owner-wrap>p{color:#aaa;line-height:1.6}
    .owner-controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.owner-controls input,.owner-controls select{min-height:44px;padding:10px 12px;border:1px solid rgba(255,255,255,.17);border-radius:9px;background:#101010;color:#fff}.owner-controls input{flex:1;min-width:200px}
    .owner-controls button,.user-actions button,.owner-top button{padding:10px 13px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:#1a1a1a;color:white;cursor:pointer}.owner-controls button.primary{border-color:transparent;background:#d52b35}
    .owner-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.owner-results{display:grid;gap:12px;margin-top:18px}.owner-user{padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#111}.owner-user h3{margin:0 0 5px;font-size:16px}.owner-user p{margin:4px 0;color:#aaa;font-size:13px;overflow-wrap:anywhere}.user-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.user-actions button.danger{border-color:rgba(255,90,90,.45);color:#ffb1b1}.owner-message{min-height:22px;margin-top:14px;color:#ffaaaa;font-size:13px}.owner-message.good{color:#a7f3d0}.owner-status{padding:24px;color:#ccc}.keys-title{margin-top:28px!important}
  </style>
  <script src="/config.js"></script>
  <script type="module" src="/owner.js"></script>
</head>
<body>
  <main class="dashboard-shell" data-owner-panel hidden>
    <header class="dash-nav"><a class="brand" href="/dashboard/" aria-label="Spider Websites dashboard"><img src="/logo.svg" alt=""><span>Spider Websites</span></a><button class="logout-button" type="button" data-owner-logout>Log out</button></header>
    <section class="owner-wrap">
      <div class="eyebrow">Restricted · Owner controls</div><h1>Owner panel</h1><p>Manage account plans and license keys. Every action is checked by the server against the authorized owner account.</p>
      <article class="dash-panel">
        <h2>Find a user by Discord ID</h2>
        <form class="owner-controls" data-search-form><input name="discord_id" inputmode="numeric" autocomplete="off" placeholder="Discord ID (17–20 digits)" required><button class="primary" type="submit">Search</button><button type="button" data-list-users>Load latest users</button></form>
        <p class="owner-message" data-owner-message role="status" aria-live="polite"></p>
        <div class="owner-results" data-user-results></div>
      </article>
      <article class="dash-panel"><div class="owner-top"><h2 class="keys-title">Recent license keys</h2></div><div class="owner-results" data-key-results><p class="muted">Keys for a user appear after search.</p></div></article>
    </section>
  </main>
  <p class="owner-status" data-owner-status role="status" aria-live="polite">Verifying owner access…</p>
</body>
</html>
